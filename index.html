<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Repayment Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Loan Repayment Calculator</h1>

    <div class="form-group">
      <label for="amount">Loan Amount</label>
      <input type="number" id="amount" placeholder="Enter loan amount">
    </div>

    <div class="form-group">
      <label for="rate">Interest Rate (%)</label>
      <input type="number" id="rate" placeholder="Enter annual interest rate">
    </div>

    <div class="form-group">
      <label for="duration">Loan Duration (Months)</label>
      <input type="number" id="duration" placeholder="Enter duration in months">
    </div>

    <button id="calculateBtn">Calculate Loan</button>
    <button id="resetBtn">Reset</button>

    <p id="message"></p>

    <div class="results">
      <h3>Results</h3>
      <p>Monthly Payment: <span id="monthlyPayment">---</span></p>
      <p>Total Repayment: <span id="totalPayment">---</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
